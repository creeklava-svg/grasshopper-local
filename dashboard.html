<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Grasshopper Dojo</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #080c14; color: #e0e6f0; min-height: 100vh; }
    .container { max-width: 1100px; margin: 0 auto; padding: 24px; }
    nav { background: rgba(8,12,20,0.85); backdrop-filter: blur(16px); border-bottom: 1px solid rgba(255,255,255,0.06); padding: 16px 0; }
    nav .container { display: flex; align-items: center; justify-content: space-between; }
    nav .logo { font-size: 1.3rem; font-weight: 700; background: linear-gradient(135deg, #6ee7b7, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-decoration: none; }
    nav .nav-links a { color: #8892a4; text-decoration: none; font-size: 0.85rem; margin-left: 20px; }
    nav .nav-links a:hover { color: #6ee7b7; }
    h1 { background: linear-gradient(135deg, #6ee7b7, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .card { background: linear-gradient(145deg, rgba(255,255,255,0.03), rgba(255,255,255,0.06)); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 24px; margin: 16px 0; }
    input[type="text"] { padding: 12px 16px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04); color: #fff; font-size: 1rem; width: 100%; margin: 8px 0; outline: none; }
    input[type="text"]:focus { border-color: #6ee7b7; }
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 28px; border-radius: 10px; font-size: 0.9rem; font-weight: 600; text-decoration: none; border: none; cursor: pointer; transition: all 0.2s; }
    .btn-primary { background: linear-gradient(135deg, #6ee7b7, #3b82f6); color: #080c14; justify-content: center; width: 100%; margin-top: 8px; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(110,231,183,0.2); }
    .btn-outline { border: 1px solid rgba(255,255,255,0.15); color: #e0e6f0; background: transparent; padding: 8px 16px; font-size: 0.85rem; }
    .hidden { display: none; }
    .error { color: #f87171; font-size: 0.85rem; margin-top: 8px; }
    .hint { font-size: 0.75rem; color: #5a6478; margin-top: 12px; }
    .hint a { color: #6ee7b7; }
    .login-box { max-width: 400px; margin: 80px auto; text-align: center; }
    .dash-header { display: flex; justify-content: space-between; align-items: center; margin: 24px 0; }
    .dash-header h2 { font-size: 1.5rem; }
    .dash-header .sub { color: #8892a4; font-size: 0.85rem; }
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin: 16px 0; }
    .stat-card .label { color: #8892a4; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-card .value { font-size: 2rem; font-weight: 700; }
    .stat-card .value.green { color: #6ee7b7; }
    .stat-card .value.blue { color: #3b82f6; }
    .stat-card .value.red { color: #f87171; }
    table { width: 100%; border-collapse: collapse; margin: 12px 0; }
    th { text-align: left; color: #8892a4; font-size: 0.8rem; font-weight: 500; text-transform: uppercase; padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,0.06); }
    td { padding: 8px 12px; font-size: 0.9rem; border-bottom: 1px solid rgba(255,255,255,0.04); }
    .badge { padding: 2px 10px; border-radius: 100px; font-size: 0.75rem; font-weight: 600; display: inline-block; }
    .badge-green { background: rgba(110,231,183,0.1); color: #6ee7b7; }
    .badge-yellow { background: rgba(251,191,36,0.1); color: #fbbf24; }
    .badge-red { background: rgba(248,113,113,0.1); color: #f87171; }
    .step { display: flex; align-items: center; gap: 12px; padding: 16px; margin: 8px 0; background: rgba(255,255,255,0.02); border-radius: 8px; }
    .step-num { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #6ee7b7, #3b82f6); display: flex; align-items: center; justify-content: center; font-weight: 700; color: #080c14; flex-shrink: 0; }
    .logout-btn { background: transparent; border: 1px solid rgba(255,255,255,0.15); color: #e0e6f0; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; }
    .logout-btn:hover { border-color: #f87171; color: #f87171; }
  </style>
</head>
<body>
  <nav>
    <div class="container">
      <a href="/" class="logo">Grasshopper Dojo</a>
      <div class="nav-links">
        <a href="/">Home</a>
        <a href="#" id="logoutBtn" class="hidden logout-btn">Sign Out</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <div id="loginView">
      <div class="card login-box">
        <h2 style="margin-bottom:16px">🔐 Client Portal</h2>
        <p style="color:#8892a4;margin-bottom:16px;font-size:0.9rem">Enter your dashboard code to view your account.</p>
        <input type="text" id="loginCode" placeholder="e.g. SMITH-001" autocomplete="off">
        <div id="loginError" class="error hidden"></div>
        <button class="btn btn-primary" onclick="login()">View Dashboard</button>
        <div class="hint">Don't have a code? <a href="https://app.younggrasshopper.io/">Start a free demo</a></div>
      </div>
    </div>

    <div id="dashboardView" class="hidden"></div>
  </div>

  <script>
    const API = 'https://app.younggrasshopper.io';

    async function login() {
      const code = document.getElementById('loginCode').value.trim().toUpperCase();
      const errEl = document.getElementById('loginError');
      if (!code) { errEl.textContent = 'Enter your dashboard code'; errEl.classList.remove('hidden'); return; }
      errEl.classList.add('hidden');

      document.getElementById('loginView').classList.add('hidden');
      document.getElementById('dashboardView').classList.remove('hidden');
      document.getElementById('dashboardView').innerHTML = '<p style="color:#8892a4;margin:40px 0;text-align:center">Loading your dashboard...</p>';
      document.getElementById('logoutBtn').classList.remove('hidden');

      try {
        const base = API || window.location.origin;
        const resp = await fetch(base + '/api/dashboard/' + encodeURIComponent(code));
        if (!resp.ok) throw new Error('Code not found');
        const data = await resp.json();
        renderDashboard(data);
      } catch (e) {
        // Fallback: try localhost:8080 directly
        try {
          const resp = await fetch('http://localhost:8080/api/dashboard/' + encodeURIComponent(code));
          if (!resp.ok) throw new Error('Code not found');
          const data = await resp.json();
          renderDashboard(data);
        } catch (e2) {
          document.getElementById('dashboardView').innerHTML = `
            <div class="card" style="max-width:400px;margin:80px auto;text-align:center">
              <h2 style="margin-bottom:12px">⚠️ Could not connect</h2>
              <p style="color:#8892a4;margin-bottom:16px">The dashboard server is starting up. Try again in a moment.</p>
              <button class="btn btn-primary" onclick="location.reload()" style="max-width:200px;margin:0 auto">Retry</button>
            </div>`;
        }
      }
    }

    function renderDashboard(data) {
      const c = data.client;
      const inv = data.invoices || [];
      const totalOut = data.total_outstanding || 0;
      const overdue = data.overdue_total || 0;
      const progress = data.progress || [];
      const today = new Date().toLocaleDateString('en-US', {weekday:'long',year:'numeric',month:'long',day:'numeric'});

      const getP = m => { const p = progress.find(x => x.metric === m); return p ? p.value : 0; };
      const getT = m => { const p = progress.find(x => x.metric === m); return p ? p.target : 0; };

      let invRows = '';
      inv.forEach(i => {
        const due = new Date(i.due_date + 'T00:00:00');
        const diff = Math.ceil((new Date() - due) / (1000*60*60*24));
        const isOverdue = i.status === 'pending' && diff > 0;
        let badge = 'badge-yellow', statusText = 'Pending';
        if (i.status === 'paid') { badge = 'badge-green'; statusText = 'Paid'; }
        if (isOverdue) { badge = 'badge-red'; statusText = diff + ' days overdue'; }
        invRows += '<tr><td>' + i.invoice_number + '</td><td>$' + i.amount.toFixed(2) + '</td><td>' + i.due_date + '</td><td><span class="badge ' + badge + '">' + statusText + '</span></td></tr>';
      });

      const onboarded = c.onboarded;

      document.getElementById('dashboardView').innerHTML = `
        <div class="dash-header">
          <div><h2>👋 ${c.business_name}</h2><div class="sub">Updated ${today}</div></div>
        </div>
        <div class="stat-grid">
          <div class="card stat-card"><div class="label">Pulse Score</div><div class="value green">${data.pulse_score || '—'}/100</div></div>
          <div class="card stat-card"><div class="label">Citations Live</div><div class="value blue">${data.directories_live || 0}</div></div>
          <div class="card stat-card"><div class="label">Blog Posts</div><div class="value blue">${data.blog_count || 0}</div></div>
          <div class="card stat-card"><div class="label">Outstanding</div><div class="value red">$${totalOut.toFixed(2)}</div></div>
        </div>
        <div class="card">
          <h3 style="margin-bottom:12px">📈 Build Progress</h3>
          <table><tr><th>Metric</th><th>Done</th><th>Target</th></tr>
            <tr><td>Directory Citations</td><td>${getP('citations')}</td><td>${getT('citations')}</td></tr>
            <tr><td>Blog Posts</td><td>${getP('blog_posts')}</td><td>${getT('blog_posts')}</td></tr>
            <tr><td>Cold Emails Sent</td><td>${getP('cold_emails')}</td><td>${getT('cold_emails')}</td></tr>
          </table>
        </div>
        ${onboarded ? '' : `
        <div class="card" style="border-color:rgba(110,231,183,0.3)">
          <h3 style="margin-bottom:12px">🚀 Get Started</h3>
          <div class="step"><div class="step-num">1</div><div><strong>Tell us about your business</strong><br><span style="color:#8892a4;font-size:0.85rem">Name, address, phone to get started</span></div></div>
          <div class="step"><div class="step-num">2</div><div><strong>Add your invoices</strong><br><span style="color:#8892a4;font-size:0.85rem">Manual entry or connect QuickBooks/Xero</span></div></div>
          <div class="step"><div class="step-num">3</div><div><strong>We do the work</strong><br><span style="color:#8892a4;font-size:0.85rem">Sit back — we handle everything</span></div></div>
          <a href="https://app.younggrasshopper.io/" class="btn btn-primary" style="margin-top:16px;max-width:300px;text-decoration:none">→ Complete Your Setup</a>
        </div>`}
        ${inv.length ? '<div class="card"><h3 style="margin-bottom:12px">📄 Invoices</h3><table><tr><th>Invoice</th><th>Amount</th><th>Due</th><th>Status</th></tr>' + invRows + '</table></div>' : ''}
        <div class="card" style="text-align:center;border-color:rgba(110,231,183,0.15)">
          <p style="color:#8892a4;font-size:0.85rem">Need help? <a href="mailto:hello@grasshopperdojo.com" style="color:#6ee7b7">hello@grasshopperdojo.com</a></p>
        </div>
      `;
    }

    // Auto-login from saved code
    const saved = localStorage.getItem('dashboard_code');
    if (saved) {
      document.getElementById('loginCode').value = saved;
      login();
    }

    document.getElementById('logoutBtn').addEventListener('click', function(e) {
      e.preventDefault();
      localStorage.removeItem('dashboard_code');
      document.getElementById('dashboardView').classList.add('hidden');
      document.getElementById('loginView').classList.remove('hidden');
      document.getElementById('logoutBtn').classList.add('hidden');
    });

    document.getElementById('loginCode').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') login();
    });
  </script>
</body>
</html>
